# Shared streaming locations for the edge (included inside a server block).
#
# Requires in http{}:  proxy_cache_path /var/cache/nginx/stream ... keys_zone=stream:...
#                      resolver <dns> valid=10s;   (127.0.0.11 inside Docker)
# Requires in server{}: set $edge_upstream edge:8080;
#
# The upstream is a *variable* on purpose. nginx resolves a plain host name in an
# upstream block once, at startup, and a container that is recreated comes back with
# a new IP — so every `compose up -d edge` turned streaming into 502s until nginx was
# reloaded by hand. With a variable the name is resolved per request, at the cost of
# not keeping upstream connections alive, which on a single host is not a real cost.
#
# - Every request (cache hit or miss) is authorised first via auth_request → /_auth.
# - slice splits client ranges into 1 MiB upstream ranges; the cache key is
#   track id + slice, never the ticket, so all users share one cached copy.
# - The cache is ephemeral LRU (ADR-0004): bounded size, evicted when idle.

location = /_auth {
    internal;
    proxy_pass http://$edge_upstream/_auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
}

location ~ ^/s/(?<track_id>[0-9]+)$ {
    auth_request /_auth;
    limit_req zone=stream_per_ip burst=40 nodelay;

    slice 1m;
    proxy_cache stream;
    proxy_cache_key "s:$track_id:$slice_range";
    proxy_set_header Range $slice_range;
    proxy_cache_valid 200 206 7d;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 20s;
    proxy_cache_use_stale error timeout updating;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_http_version 1.1;
    proxy_buffering on;
    proxy_read_timeout 60s;
    proxy_pass http://$edge_upstream;

    # stdout, so Docker rotates it with everything else instead of a file that grows.
    access_log /dev/stdout stream_cache;
    add_header X-Cache $upstream_cache_status always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;
}

location ~ ^/t/(?<thumb_id>[0-9]+)$ {
    auth_request /_auth;
    proxy_cache stream;
    proxy_cache_key "t:$thumb_id";
    proxy_cache_valid 200 30d;
    proxy_cache_valid 404 1h;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_pass http://$edge_upstream;
    add_header Access-Control-Allow-Origin "*" always;
}

location = /healthz {
    proxy_pass http://$edge_upstream/healthz;
}

# Takedown: PURGE requires ngx_cache_purge in stock nginx; instead the edge admin
# script deletes cache files by key (infra/scripts/purge-track.sh).
location / {
    return 404;
}
