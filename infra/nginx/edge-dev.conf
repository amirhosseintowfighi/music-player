# Local development edge (plain HTTP on localhost:8081).
proxy_cache_path /var/cache/nginx/stream levels=1:2 keys_zone=stream:50m
                 max_size=2g inactive=7d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=stream_per_ip:10m rate=30r/s;

upstream edge_app {
    server edge:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/stream-cache.conf;
}
