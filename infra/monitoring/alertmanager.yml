route:
  receiver: telegram
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  # A page that repeats every 4 hours is a page people keep reading.
  repeat_interval: 4h
  routes:
    - matchers: [severity="ticket"]
      receiver: telegram
      repeat_interval: 24h

receivers:
  - name: telegram
    telegram_configs:
      # Use a SEPARATE bot from the product bot: if the product bot is rate limited,
      # the alert still has to get out.
      - bot_token_file: /etc/alertmanager/ops_bot_token
        chat_id: 0
        parse_mode: HTML
        message: |
          <b>{{ .Status | toUpper }}</b> {{ .CommonLabels.alertname }}
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ if .Annotations.runbook }}runbook: {{ .Annotations.runbook }}{{ end }}
          {{ end }}

inhibit_rules:
  # If the API is down, its latency and 5xx alerts add nothing.
  - source_matchers: [alertname="ApiDown"]
    target_matchers: [severity=~"page|ticket"]
    equal: ['instance']
