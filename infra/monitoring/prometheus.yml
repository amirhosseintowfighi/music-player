global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    env: prod

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Core API. /metrics is only reachable on the internal network (nginx denies it).
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']

  # Edge nodes over WireGuard. Add one entry per node.
  - job_name: edge
    metrics_path: /metrics
    static_configs:
      - targets: ['10.8.0.2:8081']
        labels: { node: edge-1 }

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
