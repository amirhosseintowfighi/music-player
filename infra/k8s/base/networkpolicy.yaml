apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tmusic-api
spec:
  podSelector:
    matchLabels: { app: tmusic-api }
  policyTypes: [Ingress]
  ingress:
    # Only the ingress controller and Prometheus may reach the pods directly;
    # /metrics must not be public.
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports:
        - { protocol: TCP, port: 8000 }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - { protocol: TCP, port: 8000 }
