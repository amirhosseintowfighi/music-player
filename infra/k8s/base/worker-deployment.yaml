apiVersion: apps/v1
kind: Deployment
metadata:
  name: tmusic-worker
spec:
  replicas: 1
  selector:
    matchLabels: { app: tmusic-worker }
  strategy:
    # One worker at a time: the cron jobs use `unique=True`, and two rolling replicas
    # would briefly double every scheduled run.
    type: Recreate
  template:
    metadata:
      labels: { app: tmusic-worker }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: worker
          image: ghcr.io/example/tmusic-backend:latest
          command: ["arq", "app.workers.main.WorkerSettings"]
          envFrom:
            - configMapRef: { name: tmusic-config }
            - secretRef: { name: tmusic-secrets }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      terminationGracePeriodSeconds: 60
