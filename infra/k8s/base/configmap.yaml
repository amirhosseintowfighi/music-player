apiVersion: v1
kind: ConfigMap
metadata:
  name: tmusic-config
data:
  # Non-secret settings only. Everything in tmusic-secrets stays out of git.
  ENV: "prod"
  LOG_JSON: "true"
  LOG_LEVEL: "INFO"
  DB_BEHIND_PGBOUNCER: "true"
  REDIS_URL: "redis://redis:6379/0"
  MEILI_URL: "http://meilisearch:7700"
  MEILI_INDEX: "tracks"
  ACCESS_TTL_S: "900"
  REFRESH_TTL_S: "2592000"
  STREAM_TICKET_TTL_S: "300"
  RATE_LIMIT_USER_PER_MIN: "240"
  RATE_LIMIT_IP_PER_MIN: "600"
