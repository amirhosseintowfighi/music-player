<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07080c" />
    <title>Music</title>
    <!-- Where the app's API lives, for boot.js (Vite fills it in at build time). -->
    <meta name="tm-api" content="%VITE_API_URL%" />
    <!-- First, before anything that could take the page down: reports this start,
         and a crash of the last one (see public/boot.js). -->
    <script src="/boot.js"></script>
    <!-- Telegram's bridge (it exposes initData), from our own origin: telegram.org is
         filtered in Iran and a blocking script from it stalled the whole page. The
         Google Fonts stylesheet went for the same reason (and the CSP blocked it anyway). -->
    <script src="/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
