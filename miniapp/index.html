<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07080c" />
    <title>Music</title>
    <!-- Where the app's API lives, for boot.js (Vite fills it in at build time). -->
    <meta name="tm-api" content="%VITE_API_URL%" />
    <!-- First, before anything that could take the page down: reports this start,
         and a crash of the last one (see public/boot.js). -->
    <script src="/boot.js"></script>
    <!-- Telegram's own script: the SDK falls back to it, and it is what actually
         exposes initData inside the Telegram WebView. -->
    <script src="https://telegram.org/js/telegram-web-app.js?58"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
