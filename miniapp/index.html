<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07080c" />
    <meta name="description" content="Noax — نوکس — Your music, everywhere. Telegram music library." />
    <meta property="og:title" content="Noax | نوکس" />
    <meta property="og:image" content="/og.webp" />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Noax | نوکس" />
    <meta property="og:image" content="/og.png" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Vazirmatn-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Vazirmatn-latin-400.woff2" crossorigin />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Noax | نوکس</title>
    <!-- Where the app's API lives, for boot.js (Vite fills it in at build time). -->
    <meta name="tm-api" content="%VITE_API_URL%" />
    <!-- First, before anything that could take the page down: reports this start,
         and a crash of the last one (see public/boot.js). -->
    <script src="/boot.js"></script>
    <!-- Telegram's bridge (it exposes initData), from our own origin: telegram.org is
         filtered in Iran and a blocking script from it stalled the whole page. The
         Google Fonts stylesheet went for the same reason (and the CSP blocked it anyway). -->
    <script src="/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
