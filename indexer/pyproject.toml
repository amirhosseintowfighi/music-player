[project]
name = "tmusic-indexer"
version = "0.1.0"
description = "Edge service: MTProto indexer pool + audio streaming (runs outside Iran)"
requires-python = ">=3.12"
dependencies = [
    "tmusic-common",
    "telethon>=1.37,<2",
    "cryptg>=0.4",
    "httpx>=0.28",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6",
    "starlette>=0.41",
    "uvicorn[standard]>=0.32",
    "cryptography>=43",
    "structlog>=24.4",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=6.0", "mypy>=1.13", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tmusic_indexer"]

[tool.uv.sources]
tmusic-common = { path = "../shared", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["tmusic_indexer"]
omit = ["tmusic_indexer/login.py", "tmusic_indexer/main.py"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "../shared"

[[tool.mypy.overrides]]
module = ["telethon.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "PT022"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PT018", "SIM117", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["tmusic_indexer", "tmusic_common"]
