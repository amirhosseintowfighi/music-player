[project]
name = "tmusic-common"
version = "0.1.0"
description = "Code shared by the core backend and the edge indexer/streamer"
requires-python = ">=3.12"
dependencies = ["structlog>=24.4", "pydantic>=2.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tmusic_common"]
