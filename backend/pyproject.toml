[project]
name = "tmusic-backend"
version = "0.1.0"
description = "Core API, Telegram bot and background workers"
requires-python = ">=3.12"
dependencies = [
    "tmusic-common",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "redis>=5.2",
    "arq>=0.26",
    "aiogram>=3.15,<4",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
    "fakeredis>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy asyncio switches greenlets; without this, code after awaits is not traced.
concurrency = ["greenlet", "thread"]
omit = ["app/workers/main.py", "app/bot/set_webhook.py", "app/cli.py"]

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unreachable = true
mypy_path = "../shared"

[[tool.mypy.overrides]]
module = ["arq.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "PT022"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tmusic_common"]

[tool.ruff.lint.per-file-ignores]
# PT018: a compound assert reads better than three lines when it checks one result.
# Test SQL is assembled from literals only.
"tests/**" = ["S105", "S106", "S311", "S608", "E501", "PT018"]
"migrations/**" = ["E501"]
# SQL is assembled only from fixed fragments; every value is a bound parameter.
"app/services/{library,search,history,playlists,recommendations,admin,broadcast,social}.py" = ["S608", "E501"]
"app/workers/jobs.py" = ["S608"]
# Prints SQL for an operator to paste; there is no database connection here.
"app/cli.py" = ["S608"]
"tests/conftest.py" = ["S608", "ASYNC221"]

[tool.uv.sources]
tmusic-common = { path = "../shared", editable = true }
